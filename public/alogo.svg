<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Aurivest">
  <defs>
    <linearGradient id="av-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="av-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- crest / vault door -->
  <path d="M64 4 L116 26 V70 c0 27-21 45-52 54 C33 115 12 97 12 70 V26 Z"
        fill="url(#av-amber)"/>
  <path d="M64 4 L116 26 V70 c0 27-21 45-52 54 C33 115 12 97 12 70 V26 Z"
        fill="url(#av-sheen)"/>
  <path d="M64 4 L116 26 V70 c0 27-21 45-52 54 C33 115 12 97 12 70 V26 Z"
        fill="none" stroke="#7C2D12" stroke-opacity="0.35" stroke-width="2"/>

  <!-- inner bezel -->
  <path d="M64 16 L105 33 V69 c0 21-17 36-41 43 C40 105 23 90 23 69 V33 Z"
        fill="none" stroke="#FFF7E6" stroke-opacity="0.55" stroke-width="2"/>

  <!-- the A: a rising chart chevron -->
  <path d="M42 88 L64 38 L86 88" fill="none" stroke="#3B1B05" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 71 H76" fill="none" stroke="#3B1B05" stroke-width="8" stroke-linecap="round"/>

  <!-- growth spark -->
  <circle cx="64" cy="38" r="6" fill="#FFF7E6"/>
</svg>
